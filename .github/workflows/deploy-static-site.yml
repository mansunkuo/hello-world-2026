name: Build and publish Structurizr static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export static site
        run: |
          mkdir -p structurizr/static-site
          if [ -f structurizr/workspace.json ]; then
            WORKSPACE=workspace.json
          else
            WORKSPACE=workspace.dsl
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}/structurizr:/usr/local/structurizr" \
            structurizr/structurizr:latest \
            export -workspace "$WORKSPACE" -format static -output static-site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: structurizr/static-site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4